name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check key site content and brand colors
        run: |
          grep -q 'СКОЛ' index.html
          grep -q '#25282b' styles.css
          grep -q '#f5f3ee' styles.css
          grep -q '#c96b45' styles.css
