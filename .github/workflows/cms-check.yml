name: SKOL CMS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cms-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test CMS APIs
        run: npm test
